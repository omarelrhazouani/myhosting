<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>DICOM VIEWER PRO By adnane</title>

<script src="https://unpkg.com/cornerstone-core@2.6.1/dist/cornerstone.js"></script>
<script src="https://unpkg.com/cornerstone-math@0.1.10/dist/cornerstoneMath.js"></script>
<script src="https://unpkg.com/dicom-parser@1.8.21/dist/dicomParser.js"></script>
<script src="https://unpkg.com/cornerstone-wado-image-loader@4.13.2/dist/cornerstoneWADOImageLoader.bundle.min.js"></script>
<script src="https://unpkg.com/cornerstone-tools@6.0.10/dist/cornerstoneTools.js"></script>
<style>
:root {
  --bg-void:#05080a; --bg-panel:#0e1318; --bg-surface:#141b22;
  --border:#1e2d3d; --accent:#0ea5e9; --text-primary:#c8dcea;
  --ai-gold:#f59e0b; --danger:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:var(--bg-void);color:var(--text-primary);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
header{background:var(--bg-panel);padding:8px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;}
.logo-wrap{display:flex;align-items:center;gap:10px;}
.app-logo{height:42px;width:auto;}
.btn{padding:6px 11px;background:var(--bg-surface);color:white;border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:12px;transition:.15s;white-space:nowrap;}
.btn:hover{background:#1a2b3c;}
.btn.active{background:var(--accent);border-color:var(--accent);}
.btn-ia{border-color:var(--ai-gold);color:var(--ai-gold);}
.btn-ia:hover{background:#2a1e00;}
.btn-danger{border-color:var(--danger);color:var(--danger);}
.btn-danger:hover{background:#2a0a0a;}
.tabs-bar{display:flex;background:#0a0e12;padding:5px 10px 0;gap:5px;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;min-height:34px;}
.tab{padding:5px 14px;background:var(--bg-surface);border:1px solid var(--border);border-bottom:none;border-radius:5px 5px 0 0;cursor:pointer;font-size:11px;white-space:nowrap;color:#5f8aaa;}
.tab.active{background:var(--accent);color:white;border-color:var(--accent);}
.main{display:flex;flex:1;overflow:hidden;}
.sidebar{width:260px;min-width:260px;background:var(--bg-panel);border-right:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:11px;overflow-y:auto;flex-shrink:0;}
.slabel{font-size:10px;color:#5f8aaa;text-transform:uppercase;margin-bottom:4px;letter-spacing:1px;}
.tgroup{display:flex;flex-direction:column;gap:4px;}
.arow{display:flex;gap:4px;}
.abtn{flex:1;padding:6px 4px;font-size:12px;font-weight:bold;background:#1a2535;border:1px solid #2d4257;color:white;cursor:pointer;border-radius:3px;transition:.15s;}
.abtn:hover{background:var(--accent);}
.mbox{font-size:11px;background:#000;padding:8px;border:1px solid var(--border);border-radius:4px;line-height:1.5;}
.mbox b{color:var(--text-primary);}
.slider{width:100%;cursor:pointer;accent-color:var(--accent);margin:3px 0;}
.viewer-area{flex:1;background:#000;position:relative;display:flex;flex-direction:column;overflow:hidden;}
#mv{flex:1;display:grid;grid-template-columns:1fr;grid-template-rows:1fr;width:100%;height:100%;}
#mv.m2{grid-template-columns:1fr 1fr;grid-template-rows:1fr;}
#mv.m4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
.dview{border:1px solid #1f3b52;background:#000;position:relative;overflow:hidden;min-height:0;min-width:0;}
.dview.hidden{display:none!important;}
.dview.active-view{border:2px solid var(--accent)!important;}
.dview canvas{display:block;}
.drag-comment{position:absolute;padding:5px 8px;background:rgba(0,0,0,.88);color:#00ff99;border:1px solid #00ff99;border-radius:4px;cursor:move;font-size:12px;z-index:100;font-weight:bold;user-select:none;display:flex;align-items:center;gap:6px;max-width:260px;word-break:break-word;}
.cdel{flex-shrink:0;background:none;border:none;color:#f44;cursor:pointer;font-size:15px;line-height:1;padding:0 2px;font-weight:bold;}
.cdel:hover{color:red;}
#cropOvl{position:absolute;border:2px dashed #facc15;background:rgba(250,204,21,.08);pointer-events:none;display:none;z-index:50;}
#cropModal{display:none;position:fixed;inset:0;z-index:2000;background:#000;flex-direction:column;}
#cropModal.open{display:flex;}
#cropModalBar{background:#0e1318;padding:8px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1e2d3d;flex-shrink:0;}
#cropModalBar span{color:#5f8aaa;font-size:12px;}
#cropModalInfo{color:#facc15;font-size:11px;}
#cropModalClose{margin-left:auto;padding:5px 14px;background:#141b22;border:1px solid #ef4444;color:#ef4444;border-radius:4px;cursor:pointer;font-size:12px;}
#cropModalClose:hover{background:#2a0a0a;}
#cropVp{flex:1;background:#000;position:relative;}
</style>
</head>
<body>

<div id="cropModal">
  <div id="cropModalBar">
    <span>🔍 Zone rognée</span>
    <span id="cropModalInfo"></span>
    <button id="cropModalClose" onclick="closeCropModal()">✕ Fermer</button>
  </div>
  <div id="cropVp"></div>
</div>

<script>
// ── 1. Init ──────────────────────────────────────────────────────
cornerstoneWADOImageLoader.external.cornerstone = cornerstone;
cornerstoneWADOImageLoader.external.dicomParser  = dicomParser;
cornerstoneWADOImageLoader.configure({ useWebWorkers: false });

const csTools = cornerstoneTools;
csTools.external.cornerstone     = cornerstone;
csTools.external.cornerstoneMath = cornerstoneMath;
csTools.external.Hammer          = Hammer;
csTools.init({ showSVGCursors: false });

const VPS = ['v1','v2','v3','v4'].map(id => document.getElementById(id));
const TOOL_NAMES = ['Wwwc','Zoom','Pan','Length','Angle'];

VPS.forEach(v => {
  cornerstone.enable(v);
  TOOL_NAMES.forEach(n => {
    try { csTools.addToolForElement(v, csTools[n+'Tool']); } catch(e){}
  });
  v.addEventListener('mousedown', () => setActive(v));
});

// ── 2. State ─────────────────────────────────────────────────────
let active    = VPS[0];         // active viewport element
let activeTool = 'Wwwc';
let exams     = [];             // loaded exam objects
let examIdx   = -1;             // current exam index
let layout    = 1;
let selComment = null;

// per-viewport: { examIdx, imgIdx }
const VS = VPS.map(() => ({ examIdx:-1, imgIdx:0 }));

// crop state
let cropActive = false;
let cropPt     = null;          // crop start point
let cropVpReady = false;
const cropVpEl  = document.getElementById('cropVp');

// ── 3. Layout ────────────────────────────────────────────────────
function setLayout(n) {
  layout = n;
  const mv = document.getElementById('mv');
  mv.className = n===2 ? 'm2' : n===4 ? 'm4' : '';
  VPS.forEach((v,i) => v.classList.toggle('hidden', i >= n));

  setTimeout(async () => {
    for (let i = 0; i < n; i++) {
      try { cornerstone.resize(VPS[i], true); } catch(e){}
      if (examIdx !== -1) {
        const exam = exams[examIdx];
        const si = n > 1
          ? Math.min(Math.floor(i/n * exam.images.length), exam.images.length-1)
          : VS[i].imgIdx || 0;
        VS[i] = { examIdx, imgIdx: si };
        await showImg(VPS[i], i, si);
        try { cornerstone.resize(VPS[i], true); } catch(e){}
      }
    }
    setActive(VPS[0]);
  }, 100);

  ['btnS1','btnS2','btnS4'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById(n===1?'btnS1':n===2?'btnS2':'btnS4').classList.add('active');
}

// ── 4. File loading ──────────────────────────────────────────────
async function handleFiles(files) {
  if (!files.length) return;
  const sorted = Array.from(files)
    .filter(f => f.name.toLowerCase().endsWith('.dcm') || f.size > 512)
    .sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true}));

  if (!sorted.length) { alert('Aucun fichier DICOM valide.'); return; }

  const ids = sorted.map(f => cornerstoneWADOImageLoader.wadouri.fileManager.add(f));
  const name = files[0].webkitRelativePath
    ? files[0].webkitRelativePath.split('/')[0]
    : files[0].name.substring(0,14);

  exams.push({ name, images: ids });
  makeTab(exams.length-1);
  switchExam(exams.length-1);
}

function makeTab(i) {
  const t = document.createElement('div');
  t.className = 'tab';
  t.textContent = exams[i].name;
  t.onclick = () => switchExam(i);
  document.getElementById('tabsBar').appendChild(t);
}

async function switchExam(i) {
  examIdx = i;
  document.querySelectorAll('.tab').forEach((t,j) =>
    t.className = j===i ? 'tab active' : 'tab');
  const exam = exams[i];
  const sl = document.getElementById('imgSlider');
  sl.max = exam.images.length-1; sl.value = 0;

  for (let k=0; k<layout; k++) {
    const si = layout>1
      ? Math.min(Math.floor(k/layout*exam.images.length), exam.images.length-1)
      : 0;
    VS[k] = { examIdx:i, imgIdx:si };
    await showImg(VPS[k], k, si);
  }
  setActive(VPS[0]);
}

// ── 5. Show image ────────────────────────────────────────────────
async function showImg(vp, vi, si) {
  if (VS[vi].examIdx === -1) return;
  const exam = exams[VS[vi].examIdx];
  if (!exam || si >= exam.images.length) return;
  VS[vi].imgIdx = si;
  try {
    const img = await cornerstone.loadAndCacheImage(exam.images[si]);
    cornerstone.displayImage(vp, img);
    applyToolToVp(vp, activeTool);
    if (vp === active) { updateMeta(img); syncWL(vp); }
  } catch(err) { console.error(err); }
}

async function goTo(si) {
  if (examIdx===-1) return;
  const vi = VPS.indexOf(active);
  if (vi===-1) return;
  VS[vi].imgIdx = si;
  await showImg(active, vi, si);
  syncNav();
}

function syncNav() {
  if (examIdx===-1) return;
  const vi = VPS.indexOf(active);
  const si = vi!==-1 ? VS[vi].imgIdx : 0;
  document.getElementById('imgInfo').textContent = `Image : ${si+1} / ${exams[examIdx].images.length}`;
  document.getElementById('imgSlider').value = si;
}

// ── 6. Active viewport ───────────────────────────────────────────
function setActive(vp) {
  VPS.forEach(v => v.classList.remove('active-view'));
  vp.classList.add('active-view');
  active = vp;
  const vi = VPS.indexOf(vp);
  if (vi!==-1 && VS[vi].examIdx!==-1) {
    examIdx = VS[vi].examIdx;
    const exam = exams[examIdx];
    const sl = document.getElementById('imgSlider');
    sl.max   = exam.images.length-1;
    sl.value = VS[vi].imgIdx;
    document.getElementById('imgInfo').textContent = `Image : ${VS[vi].imgIdx+1} / ${exam.images.length}`;
    syncWL(vp);
  }
}

// ── 7. Tools ─────────────────────────────────────────────────────
function applyToolToVp(vp, name) {
  TOOL_NAMES.forEach(t => { try { csTools.setToolDisabledForElement(vp, t); } catch(e){} });
  try { csTools.setToolActiveForElement(vp, name, { mouseButtonMask:1 }); } catch(e){}
}

function setTool(name) {
  activeTool = name;
  VPS.forEach((v,i) => { if (i<layout) applyToolToVp(v, name); });
  document.querySelectorAll('.sidebar .btn[id^="btn-"]').forEach(b => b.classList.remove('active'));
  const b = document.getElementById('btn-'+name);
  if (b) b.classList.add('active');
}

// ── 8. Adjust values ─────────────────────────────────────────────
function adj(type, delta) {
  try {
    const vp = cornerstone.getViewport(active);
    if (!vp) return;
    if (!vp.voi) vp.voi = { windowWidth:400, windowCenter:40 };
    if (type==='ww')   vp.voi.windowWidth  = Math.max(1, vp.voi.windowWidth  + delta);
    if (type==='wc')   vp.voi.windowCenter += delta;
    if (type==='zoom') vp.scale = Math.max(0.05, vp.scale + delta);
    cornerstone.setViewport(active, vp);
    syncWL(active);
  } catch(e){}
}

function preset(ww,wc) {
  try {
    const vp = cornerstone.getViewport(active);
    if (!vp) return;
    vp.voi = { windowWidth:ww, windowCenter:wc };
    cornerstone.setViewport(active, vp);
    syncWL(active);
  } catch(e){}
}

function syncWL(vp) {
  try {
    const v = cornerstone.getViewport(vp);
    if (v && v.voi)
      document.getElementById('wlInfo').textContent =
        `WW: ${Math.round(v.voi.windowWidth)} | WC: ${Math.round(v.voi.windowCenter)}`;
  } catch(e){}
}

// ── 9. Image controls ────────────────────────────────────────────
function invertImg() {
  try { const vp=cornerstone.getViewport(active); if(!vp)return; vp.invert=!vp.invert; cornerstone.setViewport(active,vp); } catch(e){}
}
function rotateImg(deg) {
  try { const vp=cornerstone.getViewport(active); if(!vp)return; vp.rotation=((vp.rotation||0)+deg+360)%360; cornerstone.setViewport(active,vp); } catch(e){}
}
function resetView() {
  try { const img=cornerstone.getImage(active); if(!img)return; cornerstone.setViewport(active,cornerstone.getDefaultViewportForImage(active,img)); syncWL(active); } catch(e){}
}
function clearAll() {
  if (!confirm('Effacer tout ?')) return;
  VPS.forEach(v => { try { cornerstone.clear(v); } catch(e){} v.querySelectorAll('.drag-comment').forEach(c=>c.remove()); });
  exams=[]; examIdx=-1; VS.forEach(s=>{s.examIdx=-1;s.imgIdx=0;});
  document.getElementById('tabsBar').innerHTML='';
  document.getElementById('metaBox').textContent='Prêt';
  document.getElementById('imgInfo').textContent='Image : 0 / 0';
  document.getElementById('wlInfo').textContent='WW: — | WC: —';
  document.getElementById('aiReport').style.display='none';
}

// ── 10. Crop ─────────────────────────────────────────────────────
function startCrop() {
  if (examIdx===-1) { alert('Chargez une image d\'abord.'); return; }
  cropActive = true;
  TOOL_NAMES.forEach(t => { try { csTools.setToolDisabledForElement(active, t); } catch(e){} });
  document.querySelectorAll('.sidebar .btn[id^="btn-"]').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-crop').classList.add('active');
  active.style.cursor = 'crosshair';
  active.addEventListener('mousedown', onCropDown);
}

function onCropDown(e) {
  if (!cropActive) return;
  e.stopPropagation(); e.preventDefault();
  const rect = active.getBoundingClientRect();
  cropPt = { x: e.clientX-rect.left, y: e.clientY-rect.top };
  const vaRect = document.getElementById('viewerArea').getBoundingClientRect();
  const ovl = document.getElementById('cropOvl');
  ovl.style.cssText = `display:block;left:${rect.left-vaRect.left+cropPt.x}px;top:${rect.top-vaRect.top+cropPt.y}px;width:0;height:0;`;

  function onMove(ev) {
    const cx=ev.clientX-rect.left, cy=ev.clientY-rect.top;
    const x=Math.min(cx,cropPt.x), y=Math.min(cy,cropPt.y);
    ovl.style.left   = (rect.left-vaRect.left+x)+'px';
    ovl.style.top    = (rect.top-vaRect.top+y)+'px';
    ovl.style.width  = Math.abs(cx-cropPt.x)+'px';
    ovl.style.height = Math.abs(cy-cropPt.y)+'px';
  }
  function onUp(ev) {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    ovl.style.display='none';
    active.style.cursor='';
    cropActive=false;
    active.removeEventListener('mousedown', onCropDown);
    const w=Math.abs(ev.clientX-rect.left-cropPt.x), h=Math.abs(ev.clientY-rect.top-cropPt.y);
    if (w>10 && h>10) showCropModal(cropPt.x, cropPt.y, ev.clientX-rect.left, ev.clientY-rect.top);
    setTool('Wwwc');
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

async function showCropModal(x1,y1,x2,y2) {
  try {
    const img = cornerstone.getImage(active);
    if (!img) return;
    const p1 = cornerstone.canvasToPixel(active, {x:Math.min(x1,x2), y:Math.min(y1,y2)});
    const p2 = cornerstone.canvasToPixel(active, {x:Math.max(x1,x2), y:Math.max(y1,y2)});
    const iw=Math.abs(p2.x-p1.x), ih=Math.abs(p2.y-p1.y);
    if (iw<2||ih<2) return;
    const cx=(p1.x+p2.x)/2, cy=(p1.y+p2.y)/2;

    document.getElementById('cropModal').classList.add('open');
    document.getElementById('cropModalInfo').textContent =
      `${Math.round(iw)}×${Math.round(ih)} px`;

    await new Promise(r=>setTimeout(r,80));
    if (!cropVpReady) { cornerstone.enable(cropVpEl); cropVpReady=true; }
    cornerstone.resize(cropVpEl, true);
    cornerstone.displayImage(cropVpEl, img);

    const mw=cropVpEl.clientWidth, mh=cropVpEl.clientHeight;
    const sc = Math.min(mw/iw, mh/ih)*0.95;
    const sv = cornerstone.getViewport(active);
    const cv = cornerstone.getViewport(cropVpEl);
    cv.voi = {...sv.voi}; cv.invert=sv.invert; cv.rotation=sv.rotation;
    cv.scale = sc;
    cv.translation.x = -(cx - img.width/2)*sc;
    cv.translation.y = -(cy - img.height/2)*sc;
    cornerstone.setViewport(cropVpEl, cv);
  } catch(err) { console.error('Crop modal:', err); }
}

function closeCropModal() { document.getElementById('cropModal').classList.remove('open'); }
function resetCrop() { cropActive=false; active.style.cursor=''; closeCropModal(); resetView(); }

// ── 11. Comments ─────────────────────────────────────────────────
function addComment() {
  const text = prompt('Commentaire :');
  if (!text||!text.trim()) return;
  const div=document.createElement('div'); div.className='drag-comment';
  div.style.left='60px'; div.style.top='60px';
  const span=document.createElement('span'); span.textContent=text; span.style.flex='1';
  const del=document.createElement('button'); del.className='cdel'; del.textContent='✕';
  del.onclick = e => { e.stopPropagation(); div.remove(); };
  div.appendChild(span); div.appendChild(del);
  div.addEventListener('mousedown', e => {
    if (e.target===del) return;
    e.stopPropagation(); selComment=div;
    const sx=e.clientX-div.offsetLeft, sy=e.clientY-div.offsetTop;
    const mv=ev=>{div.style.left=(ev.clientX-sx)+'px';div.style.top=(ev.clientY-sy)+'px';};
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  });
  active.appendChild(div);
}
document.addEventListener('keydown', e => {
  if (e.key==='Delete'&&selComment) { selComment.remove(); selComment=null; }
});

// ── 12. Metadata ─────────────────────────────────────────────────
function updateMeta(image) {
  try {
    const ds=image.data;
    const t=tag=>{try{return ds.string('x'+tag)||'N/A';}catch{return 'N/A';}};
    document.getElementById('metaBox').innerHTML=
      `<b>Patient :</b> ${t('00100010')}<br><b>ID :</b> ${t('00100020')}<br>`+
      `<b>Modalité :</b> ${t('00080060')}<br><b>Date :</b> ${t('00080020')}<br>`+
      `<b>Étude :</b> ${t('00081030')}<br><b>Résol. :</b> ${t('00280010')}×${t('00280011')}`;
  } catch(e) { document.getElementById('metaBox').textContent='N/A'; }
}

// ── 13. IA ───────────────────────────────────────────────────────
function analyzeImage() {
  if (examIdx===-1) { alert('Chargez une image d\'abord.'); return; }
  const r=document.getElementById('aiReport');
  r.style.display='block'; r.textContent='⏳ Analyse...';
  setTimeout(()=>{ r.textContent='✅ Diagnostic : Tissus normaux.'; }, 1200);
}

// ── 14. Wheel scroll ─────────────────────────────────────────────
document.getElementById('viewerArea').addEventListener('wheel', e => {
  e.preventDefault();
  if (examIdx===-1) return;
  const vi=VPS.indexOf(active); if(vi===-1)return;
  const exam=exams[examIdx];
  const si=Math.max(0,Math.min(exam.images.length-1, VS[vi].imgIdx+(e.deltaY>0?1:-1)));
  VS[vi].imgIdx=si;
  showImg(active,vi,si); syncNav();
}, {passive:false});

// ── 15. Keyboard ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (!['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(e.key)) return;
  if (examIdx===-1) return;
  const vi=VPS.indexOf(active); if(vi===-1)return;
  const exam=exams[examIdx];
  const dir=['ArrowDown','ArrowRight'].includes(e.key)?1:-1;
  const si=Math.max(0,Math.min(exam.images.length-1,VS[vi].imgIdx+dir));
  VS[vi].imgIdx=si; showImg(active,vi,si); syncNav();
});

// ── 16. File inputs ──────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', e => handleFiles(e.target.files));
document.getElementById('folderInput').addEventListener('change', e => handleFiles(e.target.files));
document.getElementById('imgSlider').addEventListener('input', e => goTo(parseInt(e.target.value)));

// ── 17. Resize ───────────────────────────────────────────────────
window.addEventListener('resize', () => {
  VPS.forEach((v,i) => { if(i<layout) { try{cornerstone.resize(v,true);}catch(e){} } });
});
</script>
